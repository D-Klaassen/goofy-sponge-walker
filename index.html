<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Goofy Sponge Walker</title>
<style>
:root{--bg:#0b3a5c;--fg:#fffbe6;--card:#ffffff1f;--accent:#ffe14d;--muted:#bfe3ff;--ok:#7dff9b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"Comic Sans MS","Chalkboard SE",system-ui,sans-serif;overflow:hidden}
#scene{position:fixed;inset:0}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:10px;flex-wrap:wrap;pointer-events:none}
.stat{background:var(--card);backdrop-filter:blur(6px);padding:6px 14px;border-radius:14px;border:2px solid #ffffff33}
.stat b{display:block;font-size:1.3rem;color:var(--accent)}
#msg{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--card);backdrop-filter:blur(6px);padding:8px 16px;border-radius:999px;max-width:min(90vw,520px);text-align:center;pointer-events:none}
.hint{position:fixed;top:14px;right:14px;background:var(--card);backdrop-filter:blur(6px);border:2px solid #ffffff33;border-radius:12px;padding:6px 12px;font-size:.9rem;pointer-events:none}
.hint kbd{background:#fff25a;color:#1c1c1c;border:2px solid #1c1c1c;border-radius:6px;padding:0 6px;font-family:inherit;font-weight:700;box-shadow:0 2px 0 #1c1c1c}
#achOverlay{position:fixed;inset:0;display:grid;place-items:center;background:#05233a99;backdrop-filter:blur(3px);z-index:20;opacity:0;pointer-events:none;transition:opacity .18s}
#achOverlay.open{opacity:1;pointer-events:auto}
#achBox{width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 48px);overflow:auto;background:#fff8d6;color:#1c1c1c;border:5px solid #1c1c1c;border-radius:26px;box-shadow:8px 8px 0 #1c1c1c;padding:22px 24px 18px;transform:scale(.85) rotate(-1.5deg);transition:transform .22s cubic-bezier(.3,1.6,.5,1);
 background-image:radial-gradient(#f3e27a 18%,transparent 19%),radial-gradient(#f3e27a 12%,transparent 13%);background-size:90px 90px,60px 60px;background-position:10px 20px,50px 60px}
#achOverlay.open #achBox{transform:none}
#achBox header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
#achBox h2{margin:0;font-size:1.7rem;letter-spacing:.5px;text-shadow:2px 2px 0 #fff25a}
#achCount{background:#1c1c1c;color:#fff25a;border-radius:999px;padding:4px 12px;font-weight:700;white-space:nowrap}
#achBar{height:14px;border:3px solid #1c1c1c;border-radius:999px;background:#fff;overflow:hidden;margin:6px 0 16px}
#achBar i{display:block;height:100%;background:repeating-linear-gradient(45deg,#ffd23f 0 10px,#ffbf1f 10px 20px);transition:width .4s}
#achList{display:flex;flex-direction:column;gap:16px}
.achCat h3{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px;font-size:1.15rem}
.achCat h3 span{font-size:.85rem;background:#fff25a;border:2px solid #1c1c1c;border-radius:999px;padding:1px 10px}
.achGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{display:flex;gap:12px;align-items:center;background:#fff;border:3px solid #1c1c1c;border-radius:16px;padding:10px 12px;box-shadow:3px 3px 0 #1c1c1c}
.card .medal{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:1.5rem;border:3px solid #1c1c1c;background:#ffd23f}
.card b{display:block;font-size:1rem}
.card small{color:#6b6250}
.card .prog{height:7px;border:2px solid #1c1c1c;border-radius:999px;background:#eee;overflow:hidden;margin-top:5px}
.card .prog i{display:block;height:100%;background:#4fc98a}
.card.locked{background:#f1ede0}
.card.locked .medal{background:#cfc8b3;filter:grayscale(1)}
.card.locked b{color:#7a725f}
.card.got{background:#eaffef}
#achBox footer{margin-top:14px;text-align:center;font-size:.85rem;color:#6b6250}
#prompts{position:fixed;inset:0;pointer-events:none;z-index:5}
.key{position:fixed;width:84px;height:84px;pointer-events:auto;cursor:pointer;background:#fff25a;color:#1c1c1c;border:5px solid #1c1c1c;border-radius:22px;box-shadow:0 7px 0 #1c1c1c;
 font:900 2.6rem "Comic Sans MS","Chalkboard SE",system-ui,sans-serif;display:grid;place-items:center;padding:0;animation:keyIn .25s cubic-bezier(.3,1.7,.5,1)}
.key .time{position:absolute;left:6px;right:6px;bottom:-19px;height:9px;background:#fff;border:3px solid #1c1c1c;border-radius:6px;overflow:hidden}
.key .time i{display:block;height:100%;width:100%;background:#4fc98a}
.key.hurry .time i{background:#ff6f61}
.key.hit{animation:keyHit .3s forwards}.key.miss{animation:keyMiss .4s forwards;background:#ff8a7a}
@keyframes keyIn{from{transform:scale(0) rotate(-20deg)}to{transform:none}}
@keyframes keyHit{to{transform:scale(1.6) rotate(12deg);opacity:0}}
@keyframes keyMiss{30%{transform:translateX(-10px) rotate(-6deg)}60%{transform:translateX(10px) rotate(6deg)}to{transform:translateY(40px);opacity:0}}
#meter{position:fixed;left:50%;bottom:66px;transform:translateX(-50%);width:min(440px,calc(100vw - 32px));background:#fff8d6;color:#1c1c1c;border:4px solid #1c1c1c;border-radius:16px;box-shadow:5px 5px 0 #1c1c1c;padding:6px 12px 8px;pointer-events:none}
#meter .mtop{display:flex;justify-content:space-between;font-weight:700}
#meter .mbar{height:16px;margin-top:4px;border:3px solid #1c1c1c;border-radius:999px;background:#fff;overflow:hidden}
#meter .mbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4fc98a,#fff25a,#ff8c42,#ff6f61);background-size:440px 100%;transition:width .2s}
#uberBanner{position:fixed;left:50%;top:84px;transform:translateX(-50%);font:900 clamp(1.6rem,6vw,3.2rem) "Comic Sans MS","Chalkboard SE",sans-serif;color:#fff25a;-webkit-text-stroke:2px #1c1c1c;text-shadow:4px 4px 0 #1c1c1c;white-space:nowrap;pointer-events:none;display:none}
body.uber #uberBanner{display:block;animation:wobble .5s ease-in-out infinite alternate}
body.uber #meter .mbar i{background:linear-gradient(90deg,red,orange,yellow,lime,cyan,violet,red);background-size:200% 100%;animation:rainbow 1s linear infinite}
body.uber::after{content:"";position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 70px 18px #ff4fd8;animation:hue 1.2s linear infinite}
@keyframes wobble{from{transform:translateX(-50%) rotate(-4deg) scale(1)}to{transform:translateX(-50%) rotate(4deg) scale(1.08)}}
@keyframes rainbow{to{background-position:200% 0}}
@keyframes hue{to{filter:hue-rotate(360deg)}}
body.viewing #meter,body.viewing #prompts,body.viewing #uberBanner{display:none}
</style>
</head>
<body>
<div id="scene"></div>
<div id="hud">
  <div class="stat">Steps<b id="steps">0</b></div>
  <div class="stat">Distance<b id="dist">0 m</b></div>
</div>
<div class="hint">Press <kbd>Q</kbd> for achievements</div>
<div id="achOverlay" role="dialog" aria-modal="true" aria-labelledby="achTitle">
  <div id="achBox">
    <header><h2 id="achTitle">🏅 Achievements</h2><span id="achCount">0 / 0</span></header>
    <div id="achBar"><i></i></div>
    <div id="achList"></div>
    <footer>Press <b>Q</b> or <b>Esc</b> to close</footer>
  </div>
</div>
<div id="prompts"></div>
<div id="meter"><div class="mtop"><span>🤪 Goofy meter</span><span id="mName">Normal</span></div><div class="mbar"><i id="mFill"></i></div></div>
<div id="uberBanner">🤪 UBER GOOBER MODE! 🤪</div>
<div id="msg">Press the keys that pop up to fill the goofy meter! 🧽</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

// ---------- Idle game state ----------
const UPS=[];   // upgrades removed for now; sps()=0 and spc()=1 until they come back
const STEP_M=.3;   // metres per step
const fmtDist=m=>m<1000?Math.floor(m)+' m':(m/1000).toLocaleString('en',{maximumFractionDigits:m<1e4?2:m<1e5?1:0})+' km';
const fmtTime=s=>s<60?Math.floor(s)+' s':s<3600?Math.floor(s/60)+' min '+String(Math.floor(s%60)).padStart(2,'0')+' s':(s/3600).toFixed(1)+' h';
// Three separate achievement tracks; each reads its own total from the save
const ACH_CATS=[
 {id:'steps',title:'👣 Steps taken',val:()=>S.total,goal:n=>`Take ${fmt(n)} steps`,list:[[100,'First Squeak'],[1000,'Down the Lagoon'],[1e4,'Jellyfish Fields'],[1e5,'Across the Reef'],[1e6,'Sea Legs'],[1e7,'Goofiest Gait']]},
 {id:'dist',title:'🗺️ Distance walked',val:()=>S.total*STEP_M,goal:m=>`Walk ${fmtDist(m)}`,list:[[100,'Warm-up Waddle'],[1000,'Kilometre Krawl'],[1e4,'Reef Ramble'],[42195,'Marathon Sponge'],[1e6,'Ocean Crosser'],[40075000,'🌍 U Walked the Earth']]},
 {id:'uber',title:'🤪 Uber Goober time',val:()=>S.uberTime||0,goal:s=>`Be Uber Goober for ${fmtTime(s)}`,list:[[12,'First Goober'],[60,'Goober Minute'],[300,'Goober Habit'],[900,'Goober Lifestyle'],[3600,'Goober Legend']]},
];
const ACH=ACH_CATS.flatMap(c=>c.list.map(([n,t])=>({cat:c,n,t})));
const QUIPS=["I'm ready! I'm ready! I'm ready!","Squeak. Squeak. Squeak.","Knees? Never heard of 'em.","A fish stares. You strut harder.","Your shoes are 60% squeak by now.","Is it cardio if you're underwater?","Left, right, wiggle, wiggle, right!","Somewhere, a grumpy neighbor sighs."];
let S={steps:0,total:0,owned:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem('goofysponge')||'{}'))}catch(e){}
const $=id=>document.getElementById(id);
const fmt=n=>n<1e3?Math.floor(n)+'':n<1e6?(n/1e3).toFixed(1)+'K':n<1e9?(n/1e6).toFixed(2)+'M':(n/1e9).toFixed(2)+'B';
const cnt=id=>S.owned[id]||0, cost=u=>Math.ceil(u.base*1.15**cnt(u.id));
const sps=()=>UPS.reduce((a,u)=>a+(u.sps||0)*cnt(u.id),0);
const spc=()=>1+UPS.reduce((a,u)=>a+(u.click||0)*cnt(u.id),0);
const gain=n=>{S.steps+=n;S.total+=n};
const say=t=>$('msg').textContent=t;
UPS.forEach(u=>{const b=document.createElement('button');b.className='up';b.id='u_'+u.id;
 b.onclick=e=>{e.stopPropagation();const c=cost(u);if(S.steps>=c){S.steps-=c;S.owned[u.id]=cnt(u.id)+1;say(`Got ${u.name}!`);render()}};$('ups').appendChild(b)});
ACH_CATS.forEach(cat=>{const sec=document.createElement('section');sec.className='achCat';
 sec.innerHTML=`<h3>${cat.title}<span id="achCat_${cat.id}"></span></h3><div class="achGrid"></div>`;$('achList').appendChild(sec)});
ACH.forEach((a,i)=>{const c=document.createElement('div');c.className='card locked';c.id='a'+i;
 c.innerHTML=`<div class="medal">🔒</div><div style="flex:1;min-width:0"><b>${a.t}</b><small>${a.cat.goal(a.n)}</small><div class="prog"><i></i></div></div>`;
 $('achCat_'+a.cat.id).parentElement.nextElementSibling.appendChild(c)});
const overlay=$('achOverlay');
const toggleAch=open=>{overlay.classList.toggle('open',open??!overlay.classList.contains('open'));render()};
addEventListener('keydown',e=>{if(e.repeat)return;if(e.key==='q'||e.key==='Q')toggleAch();else if(e.key==='Escape')toggleAch(false)});
overlay.addEventListener('pointerdown',e=>{if(e.target===overlay)toggleAch(false)});
let gotBefore=null;
function render(){
 $('steps').textContent=fmt(S.steps);
 $('dist').textContent=fmtDist(S.total*STEP_M);
 UPS.forEach(u=>{const b=$('u_'+u.id),c=cost(u);b.disabled=S.steps<c;
  b.innerHTML=`<b>${u.name}</b> ×${cnt(u.id)}<small>${u.desc}</small><span class="cost">${fmt(c)} steps</span>`});
 let got=0;ACH.forEach((a,i)=>{const c=$('a'+i),v=a.cat.val(),done=v>=a.n;got+=done;
  if(done&&!c.classList.contains('got')){c.classList.replace('locked','got');c.querySelector('.medal').textContent='🏅';if(gotBefore!==null)say(`🏅 Achievement unlocked: ${a.t}! (press Q)`)}
  c.querySelector('.prog i').style.width=Math.min(100,v/a.n*100)+'%'});
 ACH_CATS.forEach(cat=>{const v=cat.val();$('achCat_'+cat.id).textContent=`${cat.list.filter(([n])=>v>=n).length} / ${cat.list.length}`});
 gotBefore=got;$('achCount').textContent=`${got} / ${ACH.length}`;$('achBar').firstElementChild.style.width=got/ACH.length*100+'%';
}

// ---------- World + rubber-hose sponge (from prototype-sponge.html, variant C) ----------
// ---------- shared setup ----------
const YAW=0.35;                      // walk direction vs camera: toward you, at an angle
const ZMIN=-50,SPAN=66;              // roadside props recycle between z=-50 and z=16 (road-local)
const INK='#1c1c1c',YEL='#fff25a',HOLE='#c2c23a',SIDE='#d6cf3c',SIDEHOLE='#9fa22c';
const rnd=(a,b)=>a+Math.random()*(b-a),V=(x,y,z)=>new THREE.Vector3(x,y,z);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(2,devicePixelRatio));renderer.shadowMap.enabled=true;
document.getElementById('scene').appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(38,1,.1,250);
camera.position.set(0,2.9,10);camera.lookAt(0,1.9,0);
const world=new THREE.Group();world.rotation.y=YAW;scene.add(world);   // road + sponge; local +z = walk direction

function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.lineCap=x.lineJoin='round';draw(x,w,h);
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t}
// (sky is a gradient dome, see skyDome)
const bg=()=>canvasTex(2,256,(x,w,h)=>{const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#27a9dc');g.addColorStop(.6,'#5cc9ea');g.addColorStop(1,'#a8e7f3');x.fillStyle=g;x.fillRect(0,0,w,h)});
function scroll(o,v){o.position.z-=v;if(o.position.z<ZMIN)o.position.z+=SPAN}
function roadside(o,half,far=8){const s=Math.random()<.5?-1:1;o.position.set(s*(half+rnd(.6,far)),0,rnd(ZMIN,ZMIN+SPAN));world.add(o);return o}

// ---------- drawn textures (the cartoon look lives here) ----------
const holes=(x,list,col)=>{x.fillStyle=col;list.forEach(([a,b,rx,ry,r=0])=>{x.beginPath();x.ellipse(a,b,rx,ry,r,0,7);x.fill()})};
function faceTex(){return canvasTex(512,608,(x,w,h)=>{
 x.fillStyle=YEL;x.fillRect(0,0,w,h);
 holes(x,[[58,58,28,20],[452,80,22,30],[62,530,30,24,.4],[452,520,26,20],[34,300,14,24],[480,330,16,28],[300,575,24,14],[150,580,16,12],[260,30,18,11],[380,560,12,10]],HOLE);
 x.strokeStyle=INK;x.lineWidth=7;
 for(const ex of[180,332]){                                    // big round eyes, touching
  x.fillStyle='#fff';x.beginPath();x.ellipse(ex,212,78,86,0,0,7);x.fill();x.stroke();
  x.fillStyle='#4aa6ea';x.beginPath();x.arc(ex+(ex<256?12:-8),222,31,0,7);x.fill();x.lineWidth=4;x.stroke();
  x.fillStyle=INK;x.beginPath();x.arc(ex+(ex<256?12:-8),222,14,0,7);x.fill();
  x.lineWidth=7;for(const a of[-2.0,-1.57,-1.14]){x.beginPath();x.moveTo(ex+78*Math.cos(a),212+86*Math.sin(a));x.lineTo(ex+110*Math.cos(a),212+118*Math.sin(a));x.stroke()}}
 x.fillStyle='rgba(255,110,110,.45)';for(const cx of[92,420]){x.beginPath();x.ellipse(cx,312,34,24,0,0,7);x.fill()}
 x.fillStyle='#d4553a';for(const cx of[92,420])for(const [dx,dy] of[[-12,-4],[6,-10],[10,8]]){x.beginPath();x.arc(cx+dx,312+dy,4,0,7);x.fill()}
 x.fillStyle='#fff';x.lineWidth=5;for(const tx of[220,258]){x.fillRect(tx,398,34,44);x.strokeRect(tx,398,34,44)}  // buck teeth
 x.lineWidth=8;x.beginPath();x.moveTo(108,322);x.quadraticCurveTo(256,488,404,322);x.stroke();                     // grin
 x.lineWidth=6;x.beginPath();x.moveTo(96,302);x.quadraticCurveTo(100,330,122,336);x.stroke();
 x.beginPath();x.moveTo(416,302);x.quadraticCurveTo(412,330,390,336);x.stroke();
 x.strokeStyle='#d9534f';x.lineWidth=4;x.beginPath();for(let i=0;i<=8;i++){const px=220+i*9,py=468+(i%2?5:-3);i?x.lineTo(px,py):x.moveTo(px,py)}x.stroke();  // chin squiggle
})}
const sideTex=()=>canvasTex(256,320,(x,w,h)=>{x.fillStyle=SIDE;x.fillRect(0,0,w,h);holes(x,Array.from({length:9},()=>[rnd(20,236),rnd(20,300),rnd(10,24),rnd(12,28)]),SIDEHOLE)});
const pantsTex=()=>canvasTex(256,96,(x,w,h)=>{x.fillStyle='#9a5a28';x.fillRect(0,0,w,h);x.fillStyle=INK;for(let i=0;i<w;i+=42)x.fillRect(i+6,10,28,16);x.fillStyle='#7d4618';x.fillRect(0,h-6,w,6)});
function flowerTex(col){return canvasTex(256,256,(x,w,h)=>{x.translate(128,128);x.strokeStyle=col;x.lineWidth=11;const n=5+(Math.random()<.4);
 x.beginPath();for(let i=0;i<=360;i++){const a=i/360*Math.PI*2,r=48+62*Math.pow(Math.abs(Math.sin(a*n/2)),.6);i?x.lineTo(r*Math.cos(a),r*Math.sin(a)):x.moveTo(r,0)}
 x.globalAlpha=.12;x.fillStyle=col;x.fill();x.globalAlpha=1;x.stroke();x.lineWidth=8;x.beginPath();x.arc(0,0,22,0,7);x.stroke()})}
function skyFlowers(n=11){const cols=['#8a4fd8','#ff6f61','#4fc98a','#f5d94a','#3a5fd8','#ff8fd0'],arr=[];
 for(let i=0;i<n;i++){const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:flowerTex(cols[i%cols.length]),fog:false,transparent:true,depthWrite:false}));
  sp.position.set(rnd(-45,45),rnd(9,26),rnd(-75,-40));sp.scale.setScalar(rnd(4,8));sp.userData.p=rnd(0,6);scene.add(sp);arr.push(sp)}
 return t=>arr.forEach(s=>{s.material.rotation=Math.sin(t*.3+s.userData.p)*.25;s.position.x+=Math.sin(t*.2+s.userData.p)*.004})}
const specks=(base,cols,n,w=256,h=256,extra)=>canvasTex(w,h,(x)=>{x.fillStyle=base;x.fillRect(0,0,w,h);if(extra)extra(x,w,h);for(let i=0;i<n;i++){x.fillStyle=cols[i%cols.length];x.beginPath();x.arc(rnd(0,w),rnd(0,h),rnd(1,2.6),0,7);x.fill()}});

// ---------- materials / outline ----------
function gradient(steps){const d=new Uint8Array(steps.flatMap(s=>[s,s,s,255]));const t=new THREE.DataTexture(d,steps.length,1);t.minFilter=t.magFilter=THREE.NearestFilter;t.needsUpdate=true;return t}
const matFactory=(kind,grad)=>v=>{const o=v&&v.isTexture?{map:v}:{color:v};return kind==='flat'?new THREE.MeshBasicMaterial(o):new THREE.MeshToonMaterial({...o,gradientMap:grad})};
const inkMat=new THREE.MeshBasicMaterial({color:INK,side:THREE.BackSide});
const outliner=w=>m=>{if(!m.geometry)return;m.geometry.computeBoundingBox();const s=new THREE.Vector3();m.geometry.boundingBox.getSize(s);const c=new THREE.Vector3();m.geometry.boundingBox.getCenter(c);
 const o=new THREE.Mesh(m.geometry,inkMat);o.userData.line=true;const k=[s.x,s.y,s.z].map(d=>d>1e-3?1+2*w/d:1);o.scale.set(...k);o.position.copy(c).multiply(V(1-k[0],1-k[1],1-k[2]));m.add(o)};
function inkTube(curve,r,mat,w,seg=20){const g=new THREE.Group();g.add(new THREE.Mesh(new THREE.TubeGeometry(curve,seg,r,10),mat));
 if(w){const o=new THREE.Mesh(new THREE.TubeGeometry(curve,seg,r+w,10),inkMat);o.userData.line=true;g.add(o)}return g}

// ---------- the sponge ----------
function spongeGeo(w,h,d){const g=new THREE.BoxGeometry(w,h,d,10,12,2),p=g.attributes.position;
 for(let i=0;i<p.count;i++){let x=p.getX(i),y=p.getY(i),z=p.getZ(i);
  const ex=Math.abs(Math.abs(x)-w/2)<1e-4,ey=Math.abs(Math.abs(y)-h/2)<1e-4;
  const wx=ex?Math.sign(x)*Math.sin(y*11+z*4)*.035:0,wy=ey?Math.sign(y)*Math.sin(x*10+z*4)*.03:0;
  p.setXYZ(i,(x+wx)*(1+.12*y/h),y+wy,z)}                        // wavy edges, wider at the top
 g.computeVertexNormals();return g}

function makeTorso(M,ol){
 const root=new THREE.Group(),body=new THREE.Group();root.add(body);
 const add=(m,x,y,z,p=body)=>{m.position.set(x,y,z);p.add(m);ol(m);return m};
 const side=M(sideTex());
 add(new THREE.Mesh(spongeGeo(1.6,1.9,.74),[side,side,side,side,M(faceTex()),side]),0,2.62,0);
 add(new THREE.Mesh(new THREE.BoxGeometry(1.5,.2,.7),M(0xffffff)),0,1.57,0);
 add(new THREE.Mesh(new THREE.BoxGeometry(1.52,.36,.72),M(pantsTex())),0,1.29,0);

 const frame=l=>{const off=camera.position.clone().sub(orbit.target).normalize().multiplyScalar(8.4*(1+l*.035));
  orbit.target.set(0,1.8+l*.2,0);camera.position.copy(orbit.target).add(off)};
 const setGoofy=l=>{env.setGoofy(l);if(viewer.on)frame(l);dv('dvGoofyName').textContent=`${l} · ${env.goofyNames[l]}`;gbars.forEach((b,i)=>{b.classList.toggle('on',i<=l);b.style.backgroundPosition=`${i/6*100}% 0`})};
 dv('dvGoofy').oninput=e=>setGoofy(+e.target.value);setGoofy(0);
 dv('dvPlay').onchange=e=>viewer.paused=!e.target.checked;
 dv('dvSpeed').oninput=e=>viewer.speed=+e.target.value;
 dv('dvPhase').oninput=e=>{viewer.paused=true;dv('dvPlay').checked=false;phase=+e.target.value};
 dv('dvWorld').onchange=e=>setWorld(e.target.checked);
 dv('dvInk').onchange=e=>rigMeshes.forEach(m=>{if(m.userData.line)m.visible=e.target.checked});
 dv('dvWire').onchange=e=>rigMeshes.forEach(m=>{if(!m.userData.line)[].concat(m.material).forEach(mm=>mm.wireframe=e.target.checked)});
 addEventListener('keydown',e=>{if((e.key==='m'||e.key==='M')&&!e.repeat&&!viewer.on)setOn(true)});
 viewer.tick=()=>{if(viewer.on){orbit.update();if(!viewer.paused)dv('dvPhase').value=phase%(Math.PI*2)}};
}
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.fov=camera.aspect<1?58:38;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

let boost=0,phase=0,lastStep=0;
function popText(x,y,text,size=22){const d=document.createElement('div');d.textContent=text;Object.assign(d.style,{position:'fixed',left:x+'px',top:y+'px',color:'#ffe14d',fontWeight:'bold',fontSize:size+'px',pointerEvents:'none',transition:'all .9s ease-out',textShadow:'0 2px 0 #0006',zIndex:6});
 document.body.appendChild(d);requestAnimationFrame(()=>{d.style.transform='translateY(-60px)';d.style.opacity='0'});setTimeout(()=>d.remove(),900)}
// clicking the scene does nothing for now

// ---------- Key rush: press the keys that pop up to fill the goofy meter; full meter = Uber Goober mode ----------
const KEYS='ASDFGHJKLZXCVBNUIOPERTYW';      // no Q (achievements) or M (model viewer)
const UBER_TIME=12,HIT_FILL=4,KEY_SLOW=1.9,KEY_FAST=.8,FALL_TIME=2.6;
const rush={meter:0,level:0,uber:0,cur:null,next:1.5,fall:0};
gameGoofy=()=>rush.level;
function syncLevel(){const l=rush.uber>0?6:Math.min(5,Math.floor(rush.meter*6/100));
 if(l!==rush.level){rush.level=l;if(!viewer.on)env.setGoofy(l)}
 $('mName').textContent=`${l} · ${env.goofyNames[l]}`;$('mFill').style.width=(rush.uber>0?rush.uber/UBER_TIME:rush.meter/100)*100+'%'}
function spawnKey(){const k=KEYS[Math.random()*KEYS.length|0],el=document.createElement('button');el.className='key';el.setAttribute('aria-label',`Press ${k}`);
 el.innerHTML=`${k}<span class="time"><i></i></span>`;
 el.style.left=rnd(24,innerWidth-110)+'px';el.style.top=rnd(110,Math.max(120,innerHeight-260))+'px';
 const life=rush.uber>0?KEY_FAST:KEY_SLOW-(KEY_SLOW-KEY_FAST)*rush.meter/100;   // keys get quicker as the meter fills, never faster than in Uber mode
 el.addEventListener('pointerdown',e=>{e.stopPropagation();if(rush.cur&&rush.cur.el===el)hitKey()});
 $('prompts').appendChild(el);rush.cur={k,el,t:life,life}}
function clearKey(cls){const c=rush.cur;if(!c)return;c.el.classList.add(cls);c.el.style.pointerEvents='none';setTimeout(()=>c.el.remove(),400);rush.cur=null;rush.next=rnd(.3,1)}
function hitKey(){const r=rush.cur.el.getBoundingClientRect();popText(r.left+10,r.top-10,['Nice!','Goofy!','Yes!','Wheee!'][Math.random()*4|0],26);boost=1;   // keys only fill the meter, no steps
 if(rush.uber<=0){rush.meter=Math.min(100,rush.meter+HIT_FILL);if(rush.meter>=100){rush.uber=UBER_TIME;document.body.classList.add('uber');say('🤪 UBER GOOBER MODE!')}}
 clearKey('hit');syncLevel();render()}
// a miss resets everything: meter to 0, Uber mode ends, and the sponge falls over and has to get back up
function missKey(){clearKey('miss');if(rush.meter<=0&&rush.uber<=0)return;   // empty meter: nothing to lose, no fall
 rush.meter=0;if(rush.uber>0){rush.uber=0;document.body.classList.remove('uber')}
 rush.fall=FALL_TIME;rush.next=.6;say('Whoops! 💫 Goofy meter reset…');syncLevel()}
function fallPose(){const e=FALL_TIME-rush.fall,FLAT=1.45;let a;               // root pivots at the feet; positive = face-first onto the road
 if(e<.35)a=FLAT*(e/.35)**2;                                                   // tip over, speeding up
 else if(e<.6)a=FLAT-.14*Math.sin(Math.PI*(e-.35)/.25);                         // thud + small bounce
 else if(e<1.5)a=FLAT+Math.sin(e*14)*.02;                                       // lie there, dazed
 else if(e<2.25)a=FLAT*(1-ease((e-1.5)/.75));                                   // get back up
 else a=Math.sin((e-2.25)/.35*Math.PI)*.07;                                     // little wobble before walking on
 env.rig.root.rotation.x=a}
addEventListener('keydown',e=>{if(viewer.on||e.repeat||!rush.cur||e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key.toUpperCase();
 if(k.length!==1||!KEYS.includes(k))return;if(k===rush.cur.k)hitKey();else missKey()});
function rushTick(dt){if(viewer.on||overlay.classList.contains('open'))return;                     // paused while viewing or reading achievements
 if(rush.fall>0){rush.fall=Math.max(0,rush.fall-dt);fallPose();return}                              // no keys while he's on the ground
 if(rush.uber>0){S.uberTime=(S.uberTime||0)+Math.min(dt,rush.uber);rush.uber-=dt;if(rush.uber<=0){rush.uber=0;rush.meter=0;document.body.classList.remove('uber');say('Phew… back to normal walking.')}syncLevel()}
 const c=rush.cur;if(c){c.t-=dt;c.el.querySelector('.time i').style.width=Math.max(0,c.t/c.life*100)+'%';c.el.classList.toggle('hurry',c.t<c.life*.35);if(c.t<=0)missKey()}
 else if((rush.next-=dt)<=0)spawnKey()}
syncLevel();
let camL=0;   // game camera pulls back and up as the sponge gets taller

const clock=new THREE.Clock();let acc=0;
renderer.setAnimationLoop(()=>{const dt=Math.min(.1,clock.getDelta()),t=clock.elapsedTime;
 gain(sps()*dt);acc+=dt;if(acc>.25){acc=0;render()}
 // walks faster with more steps/s and briefly after a click; road speed scales with it so the feet stay planted
 const mult=(1+Math.min(1.2,Math.log10(1+sps())*.25)+boost*.8)*(1+camL*.1);   // goofier = walks a bit faster (up to +60% at level 6)
 boost=Math.max(0,boost-dt*1.5);
 let vs=viewer.on?(viewer.paused?0:viewer.speed):1;      // model viewer can pause / slow down the walk
 rushTick(dt);
 if(!viewer.on){camL+=(rush.level-camL)*(1-Math.exp(-dt*3));camera.position.set(0,2.9+camL*.25,10*(1+camL*.07));camera.lookAt(0,1.9+camL*.22,0)}
 if(rush.fall>0)vs=0;                                       // lying down: no walking, road stops
 phase+=dt*env.omega*mult*vs;
 {const n=Math.floor(phase/Math.PI);if(n>lastStep&&!viewer.on)gain(n-lastStep);lastStep=n}   // one step per footfall (two per walk cycle)
 env.walk(env.rig,phase,dt*(vs||1));env.update(dt,t,dt*env.speed*mult*vs);viewer.tick?.();
 renderer.render(scene,camera)});

setInterval(()=>{try{localStorage.setItem('goofysponge',JSON.stringify({...S,saved:Date.now()}))}catch(e){}},5000);
if(S.saved){const off=Math.min(8*3600,(Date.now()-S.saved)/1000),g=sps()*off;if(g>0){gain(g);say(`While you were away, you strutted ${fmt(g)} steps. Squeak!`)}}
render();
</script>
</body>
</html>
